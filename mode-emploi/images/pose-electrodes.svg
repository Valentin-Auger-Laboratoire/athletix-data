<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="760" height="520" fill="#fff"/>
  <!-- bras vu de face, épaule en haut, coude en bas -->
  <path d="M150 40 C 110 120, 105 250, 130 360 C 140 410, 150 450, 165 480 L 300 480 C 315 450, 330 410, 335 360 C 350 250, 335 120, 300 40 Z" fill="#f3e3d3" stroke="#b9967a" stroke-width="2.5"/>
  <!-- biceps -->
  <path d="M175 110 C 150 190, 160 300, 205 360 C 225 385, 245 385, 262 360 C 300 300, 305 190, 285 110 C 260 95, 200 95, 175 110 Z" fill="#ead2bd" stroke="#c9a88a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="96" y="30" font-size="15" fill="#555">épaule</text>
  <text x="196" y="508" font-size="15" fill="#555">coude</text>
  <!-- axe des fibres -->
  <path d="M230 105 L 230 380" stroke="#b9967a" stroke-width="1.5" stroke-dasharray="3 5"/>
  <!-- brassard élastique -->
  <rect x="118" y="168" width="226" height="150" rx="10" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="10 6"/>
  <!-- MyoWare posé dans l'axe -->
  <rect x="200" y="182" width="60" height="122" rx="8" fill="#fde7e9" stroke="#c8102e" stroke-width="3"/>
  <circle cx="230" cy="218" r="13" fill="#e8e8e8" stroke="#666" stroke-width="2"/><circle cx="230" cy="218" r="4" fill="#777"/>
  <circle cx="230" cy="270" r="13" fill="#e8e8e8" stroke="#666" stroke-width="2"/><circle cx="230" cy="270" r="4" fill="#777"/>
  <!-- électrode de référence au coude -->
  <circle cx="290" cy="450" r="13" fill="#e8e8e8" stroke="#666" stroke-width="2"/><circle cx="290" cy="450" r="4" fill="#777"/>
  <path d="M255 300 C 280 340, 300 400, 292 437" fill="none" stroke="#888" stroke-width="2.5" stroke-dasharray="6 4"/>
  <!-- étiquettes -->
  <path d="M243 218 L 395 150" stroke="#333" stroke-width="1.3"/>
  <text x="400" y="140" font-size="16" font-weight="bold" fill="#c8102e">MID</text>
  <text x="400" y="160" font-size="14" fill="#333">au milieu du biceps, sur la partie</text>
  <text x="400" y="178" font-size="14" fill="#333">la plus bombée quand on contracte</text>
  <path d="M243 270 L 395 245" stroke="#333" stroke-width="1.3"/>
  <text x="400" y="238" font-size="16" font-weight="bold" fill="#c8102e">END</text>
  <text x="400" y="258" font-size="14" fill="#333">à côté, dans l'axe du muscle,</text>
  <text x="400" y="276" font-size="14" fill="#333">côté coude (clipsée sous le capteur)</text>
  <path d="M303 450 L 395 420" stroke="#333" stroke-width="1.3"/>
  <text x="400" y="410" font-size="16" font-weight="bold" fill="#c8102e">REF</text>
  <text x="400" y="430" font-size="14" fill="#333">sur l'os du coude (zone sans muscle),</text>
  <text x="400" y="448" font-size="14" fill="#333">avec le câble de référence (sans câble :</text>
  <text x="400" y="466" font-size="14" fill="#333">pastille REF du capteur, zone sans effort)</text>
  <path d="M344 330 L 395 335" stroke="#333" stroke-width="1.3"/>
  <text x="400" y="330" font-size="16" font-weight="bold" fill="#333">Brassard élastique</text>
  <text x="400" y="350" font-size="14" fill="#333">serré sans couper la circulation,</text>
  <text x="400" y="368" font-size="14" fill="#333">capteur aligné avec le bras</text>
  <text x="400" y="60" font-size="18" font-weight="bold" fill="#1d1d1f">Où poser les électrodes</text>
  <text x="400" y="84" font-size="13" fill="#666">bras droit vu de face, paume vers l'avant</text>
</svg>
