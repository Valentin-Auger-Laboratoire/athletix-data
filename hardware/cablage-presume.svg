<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" font-family="DejaVu Sans, Arial, sans-serif">
  <!-- Câblage PRÉSUMÉ du brassard EMG Athletix-Data, établi d'après la liste des composants commandés.
       Matériel pas encore reçu : schéma d'intention, non testé. -->
  <rect width="1400" height="800" fill="#ffffff"/>
  <text x="40" y="52" font-size="28" font-weight="bold" fill="#1d1d1f">Câblage présumé du brassard EMG</text>
  <text x="40" y="84" font-size="17" fill="#555">Établi d'après les composants commandés et les fiches SparkFun. Matériel pas encore reçu : non testé.</text>

  <!-- ===== Bras et électrodes ===== -->
  <g>
    <path d="M60 300 C 90 230, 250 220, 330 250 L 330 420 C 250 450, 90 440, 60 380 Z" fill="#f3e3d3" stroke="#c9a88a" stroke-width="2"/>
    <text x="80" y="470" font-size="15" fill="#555">Biceps (bras)</text>
    <!-- emplacement du capteur : MID et END clipsées sous la carte -->
    <rect x="112" y="282" width="156" height="76" rx="10" fill="#fde7e9" fill-opacity="0.55" stroke="#c8102e" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="150" cy="320" r="20" fill="#e8e8e8" stroke="#888" stroke-width="2"/><circle cx="150" cy="320" r="6" fill="#999"/>
    <circle cx="230" cy="320" r="20" fill="#e8e8e8" stroke="#888" stroke-width="2"/><circle cx="230" cy="320" r="6" fill="#999"/>
    <circle cx="290" cy="400" r="20" fill="#e8e8e8" stroke="#888" stroke-width="2"/><circle cx="290" cy="400" r="6" fill="#999"/>
    <text x="134" y="352" font-size="13" fill="#333">MID</text>
    <text x="214" y="352" font-size="13" fill="#333">END</text>
    <text x="236" y="440" font-size="13" fill="#333">REF (coude)</text>
    <text x="60" y="505" font-size="13" fill="#555">Le capteur se pose sur le muscle : les électrodes MID</text>
    <text x="60" y="523" font-size="13" fill="#555">(milieu du biceps) et END (à côté, dans l'axe) se</text>
    <text x="60" y="541" font-size="13" fill="#555">clipsent sous la carte. Électrodes à pression SEN-12969</text>
    <text x="60" y="559" font-size="13" fill="#555">ou ECG standard (pharmacie, salle de TP).</text>
  </g>

  <!-- le capteur posé sur le muscle -->
  <path d="M190 282 L 190 215 L 420 215" fill="none" stroke="#c8102e" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="420,215 408,209 408,221" fill="#c8102e"/>
  <text x="200" y="205" font-size="13" fill="#c8102e">posé ici, électrodes dessous</text>
  <!-- référence : pastille de la carte ou câble de référence -->
  <path d="M310 400 L 360 400 L 360 240 L 420 240" fill="none" stroke="#888" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="366" y="262" font-size="12" fill="#777">REF</text>

  <!-- ===== MyoWare 2.0 + Link Shield ===== -->
  <rect x="420" y="150" width="250" height="210" rx="14" fill="#fde7e9" stroke="#c8102e" stroke-width="3"/>
  <text x="440" y="185" font-size="19" font-weight="bold" fill="#c8102e">MyoWare 2.0</text>
  <text x="440" y="208" font-size="14" fill="#333">capteur musculaire</text>
  <text x="440" y="232" font-size="14" fill="#333">amplifie, redresse et lisse</text>
  <text x="440" y="252" font-size="14" fill="#333">→ sortie « enveloppe »</text>
  <rect x="440" y="272" width="210" height="70" rx="8" fill="#ffffff" stroke="#c8102e" stroke-width="2"/>
  <text x="455" y="300" font-size="16" font-weight="bold" fill="#c8102e">Link Shield</text>
  <text x="455" y="322" font-size="13" fill="#333">empilé, sortie jack 3,5 mm,</text>
  <text x="455" y="338" font-size="13" fill="#333">interrupteur sur ENV</text>

  <!-- ===== Câble jack : prise du Link Shield → fiche mâle → câble → 3 fils soudés sur la carte ===== -->
  <!-- prise femelle 3,5 mm au bord du Link Shield -->
  <rect x="636" y="296" width="26" height="28" rx="3" fill="#333"/>
  <circle cx="649" cy="310" r="6" fill="#111" stroke="#888" stroke-width="1.5"/>
  <text x="600" y="380" font-size="12" font-weight="bold" fill="#333">prise jack (femelle)</text>
  <path d="M649 368 L 649 326" stroke="#999" stroke-width="1.2" fill="none"/>
  <!-- fiche mâle enfoncée dans la prise : pointe, bague, corps -->
  <rect x="662" y="303" width="12" height="14" rx="5" fill="#e0a100"/>
  <rect x="674" y="303" width="3" height="14" fill="#111"/>
  <rect x="677" y="303" width="12" height="14" fill="#d62d2d"/>
  <rect x="689" y="303" width="3" height="14" fill="#111"/>
  <rect x="692" y="303" width="16" height="14" fill="#555"/>
  <rect x="708" y="299" width="30" height="22" rx="4" fill="#9a9a9a" stroke="#666" stroke-width="1.5"/>
  <text x="676" y="290" font-size="12" font-weight="bold" fill="#333">fiche mâle</text>
  <!-- câble (gaine grise) puis séparation en 3 fils -->
  <path d="M738 310 L 790 310" stroke="#8a8a8a" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M790 310 C 815 310, 815 265, 840 265 L 884 265" fill="none" stroke="#e0a100" stroke-width="4"/>
  <path d="M790 310 L 884 305" fill="none" stroke="#d62d2d" stroke-width="4"/>
  <path d="M790 310 C 815 310, 815 345, 840 345 L 884 345" fill="none" stroke="#222" stroke-width="4"/>
  <!-- soudures sur la carte -->
  <circle cx="886" cy="265" r="6" fill="#c0c0c0" stroke="#666" stroke-width="2"/>
  <circle cx="886" cy="305" r="6" fill="#c0c0c0" stroke="#666" stroke-width="2"/>
  <circle cx="886" cy="345" r="6" fill="#c0c0c0" stroke="#666" stroke-width="2"/>
  <text x="742" y="334" font-size="11" fill="#555">câble</text>
  <text x="828" y="258" font-size="11" fill="#9a6f00">pointe</text>
  <text x="828" y="298" font-size="11" fill="#b01e1e">bague</text>
  <text x="828" y="363" font-size="11" fill="#222">corps</text>
  <text x="848" y="384" font-size="11" fill="#555">soudures</text>
  <path d="M870 378 L 884 352" stroke="#999" stroke-width="1.2" fill="none"/>

  <!-- ===== Zoom : la fiche jack et ses 3 contacts ===== -->
  <rect x="430" y="398" width="450" height="130" rx="10" fill="#fafafa" stroke="#bbb" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="446" y="420" font-size="13" font-weight="bold" fill="#333">Zoom : fiche du câble audio recyclé (3,5 mm, 3 contacts)</text>
  <rect x="452" y="445" width="34" height="26" rx="12" fill="#e0a100"/>
  <rect x="486" y="445" width="7" height="26" fill="#111"/>
  <rect x="493" y="445" width="34" height="26" fill="#d62d2d"/>
  <rect x="527" y="445" width="7" height="26" fill="#111"/>
  <rect x="534" y="445" width="48" height="26" fill="#555"/>
  <rect x="582" y="438" width="70" height="40" rx="6" fill="#9a9a9a" stroke="#666" stroke-width="1.5"/>
  <path d="M652 458 L 690 458" stroke="#8a8a8a" stroke-width="12" stroke-linecap="round"/>
  <text x="456" y="492" font-size="11" fill="#9a6f00">pointe</text>
  <text x="496" y="492" font-size="11" fill="#b01e1e">bague</text>
  <text x="540" y="492" font-size="11" fill="#222">corps</text>
  <text x="700" y="447" font-size="12" fill="#9a6f00">pointe = signal → A0</text>
  <text x="700" y="465" font-size="12" fill="#b01e1e">bague = +3,3 V → 3V3</text>
  <text x="700" y="483" font-size="12" fill="#222">corps = masse → GND</text>
  <text x="446" y="508" font-size="11" fill="#555">Vieux câble « aux » stéréo : 2 anneaux noirs = 3 contacts (pas de câble à micro).</text>
  <text x="446" y="521" font-size="11" fill="#555">Autre bout coupé : repérer chaque fil au multimètre, souder sur la carte, gaine thermo.</text>

  <!-- ===== SparkFun Thing Plus ESP32-S3 ===== -->
  <rect x="900" y="150" width="270" height="300" rx="14" fill="#e6f0ea" stroke="#2f7d4f" stroke-width="3"/>
  <text x="920" y="185" font-size="19" font-weight="bold" fill="#2f7d4f">SparkFun Thing Plus</text>
  <text x="920" y="208" font-size="19" font-weight="bold" fill="#2f7d4f">ESP32-S3</text>
  <rect x="890" y="255" width="20" height="20" fill="#e0a100"/><text x="920" y="271" font-size="15" fill="#222">A0 = GPIO10 (CAN 12 bits)</text>
  <rect x="890" y="295" width="20" height="20" fill="#d62d2d"/><text x="920" y="311" font-size="15" fill="#222">3V3</text>
  <rect x="890" y="335" width="20" height="20" fill="#222"/><text x="920" y="351" font-size="15" fill="#222">GND</text>
  <text x="1010" y="271" font-size="13" fill="#555"></text>
  <text x="920" y="392" font-size="13" fill="#333">500 mesures/s, RMS 200 ms,</text>
  <text x="920" y="410" font-size="13" fill="#333">alerte 75 % / 70 %</text>
  <rect x="1150" y="395" width="20" height="40" fill="#555"/><text x="1182" y="412" font-size="13" fill="#555">prise</text><text x="1182" y="428" font-size="13" fill="#555">batterie JST</text>
  <rect x="1060" y="440" width="50" height="14" rx="4" fill="#777"/>
  <line x1="1085" y1="454" x2="1085" y2="488" stroke="#777" stroke-width="5"/>
  <rect x="955" y="488" width="200" height="56" rx="10" fill="#f4f4f6" stroke="#777" stroke-width="2"/>
  <text x="975" y="511" font-size="14" font-weight="bold" fill="#333">câble USB-C</text>
  <text x="975" y="531" font-size="12" fill="#555">recharge 5 V, programmation</text>

  <!-- ===== Bluetooth vers téléphone ===== -->
  <path d="M1170 230 Q 1210 200 1250 230" fill="none" stroke="#2f6fd6" stroke-width="3"/>
  <path d="M1180 215 Q 1210 180 1240 215" fill="none" stroke="#2f6fd6" stroke-width="3"/>
  <text x="1178" y="268" font-size="14" font-weight="bold" fill="#2f6fd6">Bluetooth LE</text>
  <text x="1178" y="286" font-size="13" fill="#2f6fd6">~50 paquets/s</text>
  <rect x="1295" y="160" width="90" height="170" rx="16" fill="#f4f4f6" stroke="#333" stroke-width="3"/>
  <rect x="1307" y="180" width="66" height="120" rx="4" fill="#ffe9cc"/>
  <text x="1313" y="236" font-size="12" fill="#333">appli</text>
  <text x="1313" y="252" font-size="12" fill="#333">Flutter</text>
  <text x="1305" y="352" font-size="13" fill="#555">téléphone</text>

  <!-- ===== Alimentation ===== -->
  <rect x="420" y="560" width="230" height="110" rx="14" fill="#eef1fb" stroke="#4659a8" stroke-width="3"/>
  <text x="440" y="595" font-size="18" font-weight="bold" fill="#4659a8">Batterie LiPo</text>
  <text x="440" y="620" font-size="15" fill="#333">3,7 V · 1 500 mAh</text>
  <text x="440" y="645" font-size="13" fill="#555">(rechargée par l'USB-C)</text>
  <text x="420" y="692" font-size="13" font-weight="bold" fill="#c8102e">⚠ Avant de brancher : le fil rouge doit arriver sur le + de la prise JST</text>
  <text x="420" y="710" font-size="13" fill="#c8102e">(le sens du connecteur varie selon le fabricant ; une inversion peut détruire la carte)</text>
  <!-- fil + avec interrupteur -->
  <path d="M650 590 L 780 590" stroke="#d62d2d" stroke-width="5" fill="none"/>
  <circle cx="790" cy="590" r="7" fill="#fff" stroke="#333" stroke-width="3"/>
  <line x1="796" y1="586" x2="840" y2="562" stroke="#333" stroke-width="4"/>
  <circle cx="850" cy="590" r="7" fill="#fff" stroke="#333" stroke-width="3"/>
  <text x="760" y="545" font-size="14" font-weight="bold" fill="#333">interrupteur DS12LR</text>
  <path d="M857 590 L 1160 590 L 1160 435" stroke="#d62d2d" stroke-width="5" fill="none"/>
  <path d="M650 640 L 1172 640 L 1172 435" stroke="#222" stroke-width="5" fill="none"/>
  <text x="900" y="580" font-size="13" fill="#b01e1e">fil rouge FC25R + gaine thermo</text>
  <text x="900" y="665" font-size="13" fill="#222">fil noir FC25N + gaine thermo</text>

  <!-- ===== Légende ===== -->
  <rect x="40" y="572" width="340" height="112" rx="10" fill="#fafafa" stroke="#ccc" stroke-width="1.5"/>
  <text x="56" y="594" font-size="14" font-weight="bold" fill="#333">Légende</text>
  <line x1="56" y1="612" x2="96" y2="612" stroke="#e0a100" stroke-width="5"/><text x="106" y="617" font-size="13" fill="#333">signal analogique (enveloppe)</text>
  <line x1="56" y1="632" x2="96" y2="632" stroke="#d62d2d" stroke-width="5"/><text x="106" y="637" font-size="13" fill="#333">+3,3 V capteur / + batterie</text>
  <line x1="56" y1="652" x2="96" y2="652" stroke="#222" stroke-width="5"/><text x="106" y="657" font-size="13" fill="#333">masse (GND)</text>
  <line x1="220" y1="652" x2="260" y2="652" stroke="#888" stroke-width="3" stroke-dasharray="7 5"/><text x="268" y="657" font-size="13" fill="#333">référence</text>
  <path d="M56 676 Q 76 664 96 676" fill="none" stroke="#2f6fd6" stroke-width="3"/><text x="106" y="678" font-size="13" fill="#333">Bluetooth LE (sans fil)</text>

  <!-- ===== Notes ===== -->
  <text x="40" y="742" font-size="14" fill="#555">Le capteur est alimenté en 3,3 V par la carte, donc sa sortie reste dans la plage du convertisseur (0 à 3,3 V). Jauge de batterie MAX17048 intégrée à la carte (I2C, GPIO8 / GPIO9).</text>
  <text x="40" y="764" font-size="14" fill="#555">Non représentés : inverseurs GR33 / GA55 et résistances 150 Ω (usage à définir). Le câble Qwiic du devis est une liaison I2C : il ne transporte pas ce signal analogique.</text>
  <text x="40" y="786" font-size="14" fill="#555">Le montage n'est pas étanche : pour la natation, il faudra un boîtier étanche (en attendant, essais hors de l'eau).</text>
</svg>
